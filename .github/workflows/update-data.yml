name: Update Beach Data

on:
  schedule:
    # Every day at 22:00 UTC (19:00 Rio time)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download INEA bulletins
        # A missing source only means the parser keeps last known statuses
        run: ./scripts/download_bulletins.sh || echo "⚠️ Bulletin download failed; relying on Power BI and baseline"

      - name: Fetch Power BI data
        run: python3 scripts/fetch_powerbi.py --output powerbi.json || rm -f powerbi.json

      - name: Generate beach data
        run: |
          if [ -f powerbi.json ]; then
            python3 scripts/parse_inea_bulletin.py --powerbi-file powerbi.json
          else
            python3 scripts/parse_inea_bulletin.py
          fi

      - name: Validate generated data
        run: python3 scripts/test_parsing.py

      - name: Commit updated data
        run: |
          if git diff --quiet data/beachData.json; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beachData.json
          git commit -m "chore(data): update beach data"
          git push

  # GITHUB_TOKEN pushes do not trigger the push-based deploy workflow,
  # so deployment is invoked explicitly after the data update
  deploy:
    needs: update-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
