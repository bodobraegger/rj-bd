name: Update Beach Data

on:
  schedule:
    # Every day at 22:00 UTC (19:00 Rio time)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Update beach data
        # Bulletin PDFs are geo-blocked outside Brazil, so from here only
        # Power BI can refresh; a systemd timer on a Brazilian machine runs
        # the same script (see docs/inea-data-sources.md)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/update_data.sh --push

  # GITHUB_TOKEN pushes do not trigger the push-based deploy workflow,
  # so deployment is invoked explicitly after the data update
  deploy:
    needs: update-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
