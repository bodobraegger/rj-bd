name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_call: # Reused by update-data.yml after it commits fresh data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Deploy the branch tip, not the triggering commit: when called from
          # update-data.yml the data commit it just pushed must be included
          ref: main

      - name: Stamp service worker cache version
        run: sed -i "s/BUILD_TIMESTAMP/$(date +%s)/g" js/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  # Separate job: directly after the upload in the same job, deploy-pages often
  # does not find the artifact (https://github.com/actions/deploy-pages/issues/451)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
