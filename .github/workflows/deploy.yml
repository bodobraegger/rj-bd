name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_call: # Reused by update-data.yml after it commits fresh data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Deploy the branch tip, not the triggering commit: when called from
          # update-data.yml the data commit it just pushed must be included
          ref: main

      - name: Stamp service worker cache version
        run: sed -i "s/BUILD_TIMESTAMP/$(date +%s)/g" js/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
